server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: charity-donation
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/charity_donation?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      encoding: UTF-8
      continue-on-error: false
  jackson:
    time-zone: Asia/Shanghai
    deserialization:
      fail-on-unknown-properties: true

app:
  demo:
    enabled: ${DEMO_DATA_ENABLED:false}
    admin-username: ${DEMO_ADMIN_USERNAME:}
    admin-password: ${DEMO_ADMIN_PASSWORD:}
